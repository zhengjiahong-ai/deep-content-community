<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#243447}.h1{font-size:32px;font-weight:700;fill:#17324d}.sub{font-size:16px;fill:#64748b}.celltitle{font-size:21px;font-weight:700;fill:#17324d}.body{font-size:17px;fill:#334155}.small{font-size:14px;fill:#64748b}</style></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="48" y="55" class="h1">图 3｜竞品生态的任务覆盖矩阵</text><text x="50" y="86" class="sub">按用户任务比较不同产品类别的能力重心｜避免把单项功能缺失误判为市场空白</text><rect x="40" y="130" width="1520" height="690" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="40" y="130" width="250" height="95" fill="#e8eef4" stroke="#cbd5e1"/><text x="165" y="166" text-anchor="middle" class="celltitle" style="font-size:18px">任务维度</text><rect x="290" y="130" width="250" height="95" fill="#e8eef4" stroke="#cbd5e1"/><text x="415" y="166" text-anchor="middle" class="celltitle" style="font-size:18px">内容平台</text><text x="415" y="195" text-anchor="middle" class="small">小宇宙 / 微信读书</text><rect x="540" y="130" width="260" height="95" fill="#e8eef4" stroke="#cbd5e1"/><text x="670" y="166" text-anchor="middle" class="celltitle" style="font-size:18px">内容捕捉</text><text x="670" y="195" text-anchor="middle" class="small">Snipd / Reader / Cubox</text><rect x="800" y="130" width="250" height="95" fill="#e8eef4" stroke="#cbd5e1"/><text x="925" y="166" text-anchor="middle" class="celltitle" style="font-size:18px">个人知识管理</text><text x="925" y="195" text-anchor="middle" class="small">flomo / Obsidian</text><rect x="1050" y="130" width="240" height="95" fill="#e8eef4" stroke="#cbd5e1"/><text x="1170" y="166" text-anchor="middle" class="celltitle" style="font-size:18px">内容社区</text><text x="1170" y="195" text-anchor="middle" class="small">豆瓣 / 即刻</text><rect x="1290" y="130" width="270" height="95" fill="#e8eef4" stroke="#cbd5e1"/><text x="1425" y="166" text-anchor="middle" class="celltitle" style="font-size:18px">本组候选</text><text x="1425" y="195" text-anchor="middle" class="small">P0 / P1</text><rect x="40" y="225" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="165" y="280" text-anchor="middle" class="celltitle" style="font-size:17px">内容发现与消费</text><rect x="290" y="225" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="415" y="280" text-anchor="middle" class="body" style="font-size:16px">核心</text><rect x="540" y="225" width="260" height="99" fill="#fff" stroke="#d7dee7"/><text x="670" y="280" text-anchor="middle" class="body" style="font-size:16px">非核心</text><rect x="800" y="225" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="925" y="280" text-anchor="middle" class="body" style="font-size:16px">非核心</text><rect x="1050" y="225" width="240" height="99" fill="#fff" stroke="#d7dee7"/><text x="1170" y="280" text-anchor="middle" class="body" style="font-size:16px">部分</text><rect x="1290" y="225" width="270" height="99" fill="#fff" stroke="#d7dee7"/><text x="1425" y="280" text-anchor="middle" class="body" style="font-size:16px">不自建</text><rect x="40" y="324" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="165" y="379" text-anchor="middle" class="celltitle" style="font-size:17px">片段捕捉与出处定位</text><rect x="290" y="324" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="415" y="379" text-anchor="middle" class="body" style="font-size:16px">平台内较强</text><rect x="540" y="324" width="260" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="670" y="379" text-anchor="middle" class="body" style="font-size:16px">核心</text><rect x="800" y="324" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="925" y="379" text-anchor="middle" class="body" style="font-size:16px">部分 / 手工</text><rect x="1050" y="324" width="240" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="1170" y="379" text-anchor="middle" class="body" style="font-size:16px">部分</text><rect x="1290" y="324" width="270" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="1425" y="379" text-anchor="middle" class="body" style="font-size:16px">P0 核心</text><rect x="40" y="423" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="165" y="478" text-anchor="middle" class="celltitle" style="font-size:17px">个人理解沉淀</text><rect x="290" y="423" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="415" y="478" text-anchor="middle" class="body" style="font-size:16px">评论 / 批注</text><rect x="540" y="423" width="260" height="99" fill="#fff" stroke="#d7dee7"/><text x="670" y="478" text-anchor="middle" class="body" style="font-size:16px">高亮 / 笔记</text><rect x="800" y="423" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="925" y="478" text-anchor="middle" class="body" style="font-size:16px">核心</text><rect x="1050" y="423" width="240" height="99" fill="#fff" stroke="#d7dee7"/><text x="1170" y="478" text-anchor="middle" class="body" style="font-size:16px">动态 / 评论</text><rect x="1290" y="423" width="270" height="99" fill="#fff" stroke="#d7dee7"/><text x="1425" y="478" text-anchor="middle" class="body" style="font-size:16px">P0 核心</text><rect x="40" y="522" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="165" y="577" text-anchor="middle" class="celltitle" style="font-size:17px">跨来源检索回顾</text><rect x="290" y="522" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="415" y="577" text-anchor="middle" class="body" style="font-size:16px">平台内有限</text><rect x="540" y="522" width="260" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="670" y="577" text-anchor="middle" class="body" style="font-size:16px">部分产品较强</text><rect x="800" y="522" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="925" y="577" text-anchor="middle" class="body" style="font-size:16px">依赖手工组织</text><rect x="1050" y="522" width="240" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="1170" y="577" text-anchor="middle" class="body" style="font-size:16px">通常非核心</text><rect x="1290" y="522" width="270" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="1425" y="577" text-anchor="middle" class="body" style="font-size:16px">P0 待验证</text><rect x="40" y="621" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="165" y="676" text-anchor="middle" class="celltitle" style="font-size:17px">围绕观点的主题讨论</text><rect x="290" y="621" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="415" y="676" text-anchor="middle" class="body" style="font-size:16px">单集 / 作品内</text><rect x="540" y="621" width="260" height="99" fill="#fff" stroke="#d7dee7"/><text x="670" y="676" text-anchor="middle" class="body" style="font-size:16px">非核心</text><rect x="800" y="621" width="250" height="99" fill="#fff" stroke="#d7dee7"/><text x="925" y="676" text-anchor="middle" class="body" style="font-size:16px">非核心</text><rect x="1050" y="621" width="240" height="99" fill="#fff" stroke="#d7dee7"/><text x="1170" y="676" text-anchor="middle" class="body" style="font-size:16px">核心</text><rect x="1290" y="621" width="270" height="99" fill="#fff" stroke="#d7dee7"/><text x="1425" y="676" text-anchor="middle" class="body" style="font-size:16px">P1 可选</text><rect x="40" y="720" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="165" y="775" text-anchor="middle" class="celltitle" style="font-size:17px">回到原始内容</text><rect x="290" y="720" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="415" y="775" text-anchor="middle" class="body" style="font-size:16px">平台内较强</text><rect x="540" y="720" width="260" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="670" y="775" text-anchor="middle" class="body" style="font-size:16px">依赖锚点能力</text><rect x="800" y="720" width="250" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="925" y="775" text-anchor="middle" class="body" style="font-size:16px">依赖来源记录</text><rect x="1050" y="720" width="240" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="1170" y="775" text-anchor="middle" class="body" style="font-size:16px">依赖外链</text><rect x="1290" y="720" width="270" height="99" fill="#f8fafc" stroke="#d7dee7"/><text x="1425" y="775" text-anchor="middle" class="body" style="font-size:16px">P0 目标</text><rect x="40" y="850" width="1520" height="75" rx="10" fill="#eef3f7"/><text x="60" y="880" class="body" style="font-size:16px">本矩阵概括产品类别的能力重心，不是同条件量化评分，也不表示每个产品都具备该类别的全部能力。</text><text x="60" y="907" class="body" style="font-size:16px">本组不与内容平台争夺播放；P0 先验证“片段 + 出处 + 个人理解 + 检索回顾”，P1 主题讨论仅为可选增量。</text></svg>