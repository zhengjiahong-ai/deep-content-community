<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#26384a}.h1{font-size:32px;font-weight:700;fill:#17324d}.sub{font-size:16px;fill:#64748b}.ct{font-size:20px;font-weight:700;fill:#17324d}.bd{font-size:16px;fill:#334155}.sm{font-size:14px;fill:#64748b}</style></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="42" y="52" class="h1">图 2｜小宇宙商业模式画布（九模块）</text><text x="44" y="82" class="sub">焦点竞品｜听众、创作者和品牌方共同构成价值流</text><rect x="30" y="115" width="285" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="30" y="115" width="7" height="275" rx="3" fill="#55758f"/><text x="48" y="149" class="ct">重要合作 KP</text><text x="48" y="180" class="bd" style="font-size:16px">• 主播、节目制作机构</text><text x="48" y="205" class="bd" style="font-size:16px">• RSS 内容供给方</text><text x="48" y="230" class="bd" style="font-size:16px">• 品牌广告主与合作机构</text><text x="48" y="255" class="bd" style="font-size:16px">• 应用商店、支付服务</text><text x="48" y="280" class="bd" style="font-size:16px">• 线下活动和行业伙伴</text><rect x="325" y="115" width="285" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="325" y="115" width="7" height="275" rx="3" fill="#2f6b8a"/><text x="343" y="149" class="ct">关键业务 KA</text><text x="343" y="180" class="bd" style="font-size:16px">• 内容发现、搜索和播放</text><text x="343" y="205" class="bd" style="font-size:16px">• 时间点互动与社区运营</text><text x="343" y="230" class="bd" style="font-size:16px">• 创作者接入和数据服务</text><text x="343" y="255" class="bd" style="font-size:16px">• 会员、付费内容、商单</text><text x="343" y="280" class="bd" style="font-size:16px">• 审核、举报与活动运营</text><rect x="325" y="400" width="285" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="325" y="400" width="7" height="275" rx="3" fill="#2f6b8a"/><text x="343" y="434" class="ct">核心资源 KR</text><text x="343" y="465" class="bd" style="font-size:16px">• 节目供给与托管能力</text><text x="343" y="490" class="bd" style="font-size:16px">• 播放器、发现和搜索系统</text><text x="343" y="515" class="bd" style="font-size:16px">• 听众互动网络</text><text x="343" y="540" class="bd" style="font-size:16px">• 创作者关系与后台工具</text><text x="343" y="565" class="bd" style="font-size:16px">• 收听、互动数据和品牌资产</text><rect x="620" y="115" width="340" height="560" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="620" y="115" width="7" height="560" rx="3" fill="#2f7d73"/><text x="638" y="149" class="ct">价值主张 VP</text><text x="638" y="180" class="bd" style="font-size:16px">听众</text><text x="638" y="205" class="bd" style="font-size:16px">• 播客发现、收听和追更</text><text x="638" y="230" class="bd" style="font-size:16px">• 时间点评论、回复与原声回听</text><text x="638" y="255" class="bd" style="font-size:16px">• PLUS 时点收藏和私人笔记</text><text x="638" y="280" class="bd" style="font-size:16px"></text><text x="638" y="305" class="bd" style="font-size:16px">创作者</text><text x="638" y="330" class="bd" style="font-size:16px">• 节目接入、互动与数据分析</text><text x="638" y="355" class="bd" style="font-size:16px">• 商业化和运营入口</text><text x="638" y="380" class="bd" style="font-size:16px"></text><text x="638" y="405" class="bd" style="font-size:16px">品牌方</text><text x="638" y="430" class="bd" style="font-size:16px">• 通过节目与创作者触达受众</text><rect x="970" y="115" width="265" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="970" y="115" width="7" height="275" rx="3" fill="#2f6b8a"/><text x="988" y="149" class="ct">客户关系 CR</text><text x="988" y="180" class="bd" style="font-size:16px">• 自助发现、订阅与续播</text><text x="988" y="205" class="bd" style="font-size:16px">• 时间点评论和楼中楼回复</text><text x="988" y="230" class="bd" style="font-size:16px">• 主播回复、置顶和投票</text><text x="988" y="255" class="bd" style="font-size:16px">• PLUS 会员服务</text><text x="988" y="280" class="bd" style="font-size:16px">• 创作者后台、品牌对接</text><rect x="970" y="400" width="265" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="970" y="400" width="7" height="275" rx="3" fill="#2f6b8a"/><text x="988" y="434" class="ct">渠道通路 CH</text><text x="988" y="465" class="bd" style="font-size:16px">听众：应用商店、分享</text><text x="988" y="490" class="bd" style="font-size:16px">发现页、搜索、节目页</text><text x="988" y="515" class="bd" style="font-size:16px">订阅页和播放器</text><text x="988" y="540" class="bd" style="font-size:16px"></text><text x="988" y="565" class="bd" style="font-size:16px">创作者/品牌：后台</text><text x="988" y="590" class="bd" style="font-size:16px">RSS 认领、原生上传</text><text x="988" y="615" class="bd" style="font-size:16px">品牌资源与商单入口</text><rect x="1245" y="115" width="325" height="560" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="1245" y="115" width="7" height="560" rx="3" fill="#55758f"/><text x="1263" y="149" class="ct">客户细分 CS</text><text x="1263" y="180" class="bd" style="font-size:16px">听众</text><text x="1263" y="205" class="bd" style="font-size:16px">• 免费收听、订阅和评论</text><text x="1263" y="230" class="bd" style="font-size:16px">• PLUS 工具权益用户</text><text x="1263" y="255" class="bd" style="font-size:16px">• 付费节目/专题用户</text><text x="1263" y="280" class="bd" style="font-size:16px"></text><text x="1263" y="305" class="bd" style="font-size:16px">内容供给方</text><text x="1263" y="330" class="bd" style="font-size:16px">• 主播、制作团队、运营者</text><text x="1263" y="355" class="bd" style="font-size:16px"></text><text x="1263" y="380" class="bd" style="font-size:16px">商业客户</text><text x="1263" y="405" class="bd" style="font-size:16px">• 品牌方与广告主</text><rect x="30" y="690" width="760" height="190" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="30" y="690" width="7" height="190" rx="3" fill="#a66a3f"/><text x="48" y="724" class="ct">成本结构 C$</text><text x="48" y="755" class="bd" style="font-size:16px">• 创作者结算（具体规则待核）</text><text x="48" y="780" class="bd" style="font-size:16px">• 托管、存储、带宽和 CDN</text><text x="48" y="805" class="bd" style="font-size:16px">• 研发、搜索/推荐与 AI 运维</text><text x="48" y="830" class="bd" style="font-size:16px">• 审核、版权、客服、商务和活动</text><rect x="800" y="690" width="770" height="190" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="800" y="690" width="7" height="190" rx="3" fill="#2f7d73"/><text x="818" y="724" class="ct">收入来源 R$</text><text x="818" y="755" class="bd" style="font-size:16px">• PLUS 连续会员订阅</text><text x="818" y="780" class="bd" style="font-size:16px">• 付费单集、专题或节目</text><text x="818" y="805" class="bd" style="font-size:16px">• 听众赞赏</text><text x="818" y="830" class="bd" style="font-size:16px">• 品牌播客、广告合作和追光商单</text><text x="36" y="910" class="sm">注：成本项为团队归纳的成本驱动因素，不代表实际金额或占比；收入机制有公开资料及体验支持，实际收入、分成规则、成本金额和利润未公开。</text></svg>