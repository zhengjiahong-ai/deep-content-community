<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970"><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#243447}.h1{font-size:32px;font-weight:700;fill:#17324d}.sub{font-size:16px;fill:#64748b}.celltitle{font-size:21px;font-weight:700;fill:#17324d}.body{font-size:17px;fill:#334155}.small{font-size:14px;fill:#64748b}</style></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="48" y="55" class="h1">图 1｜小宇宙商业模式画布（九模块）</text><text x="50" y="86" class="sub">焦点竞品：小宇宙｜按听众、创作者与品牌方三类参与者组织价值流</text><rect x="40" y="130" width="290" height="570" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="130" width="7" height="570" rx="3" fill="#55758f"/><text x="60" y="169" class="celltitle">重要合作 KP</text><text x="60" y="204" class="body" style="font-size:17px">• 播客主播、节目机构</text><text x="60" y="230" class="body" style="font-size:17px">• RSS 内容供给方</text><text x="60" y="256" class="body" style="font-size:17px">• 品牌广告主与合作机构</text><text x="60" y="282" class="body" style="font-size:17px">• 应用商店、支付服务</text><text x="60" y="308" class="body" style="font-size:17px">• 线下活动与行业伙伴</text><rect x="340" y="130" width="290" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="340" y="130" width="7" height="280" rx="3" fill="#2f6b8a"/><text x="360" y="169" class="celltitle">关键业务 KA</text><text x="360" y="204" class="body" style="font-size:17px">• 内容发现、搜索、播放</text><text x="360" y="230" class="body" style="font-size:17px">• 时间点评论与社区运营</text><text x="360" y="256" class="body" style="font-size:17px">• 创作者接入和数据服务</text><text x="360" y="282" class="body" style="font-size:17px">• 会员、付费内容与商单</text><text x="360" y="308" class="body" style="font-size:17px">• 审核、举报和线下活动</text><rect x="340" y="420" width="290" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="340" y="420" width="7" height="280" rx="3" fill="#2f6b8a"/><text x="360" y="459" class="celltitle">核心资源 KR</text><text x="360" y="494" class="body" style="font-size:17px">• 节目供给：RSS / 原生托管</text><text x="360" y="520" class="body" style="font-size:17px">• 播放器、发现与搜索系统</text><text x="360" y="546" class="body" style="font-size:17px">• 听众互动网络</text><text x="360" y="572" class="body" style="font-size:17px">• 创作者关系和后台工具</text><text x="360" y="598" class="body" style="font-size:17px">• 收听、互动数据与品牌资产</text><rect x="640" y="130" width="300" height="570" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="640" y="130" width="7" height="570" rx="3" fill="#2f7d73"/><text x="660" y="169" class="celltitle">价值主张 VP</text><text x="660" y="204" class="body" style="font-size:17px">听众</text><text x="660" y="230" class="body" style="font-size:17px">• 播客发现、收听与追更</text><text x="660" y="256" class="body" style="font-size:17px">• 围绕声音时刻评论、回复</text><text x="660" y="282" class="body" style="font-size:17px">• 时间戳回听原声</text><text x="660" y="308" class="body" style="font-size:17px">• PLUS 私人时点记录等权益</text><text x="660" y="334" class="body" style="font-size:17px"></text><text x="660" y="360" class="body" style="font-size:17px">创作者</text><text x="660" y="386" class="body" style="font-size:17px">• 节目接入、互动、数据分析</text><text x="660" y="412" class="body" style="font-size:17px">• 商业化与运营入口</text><text x="660" y="438" class="body" style="font-size:17px"></text><text x="660" y="464" class="body" style="font-size:17px">品牌方</text><text x="660" y="490" class="body" style="font-size:17px">• 节目及创作者受众触达</text><rect x="950" y="130" width="270" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="950" y="130" width="7" height="280" rx="3" fill="#2f6b8a"/><text x="970" y="169" class="celltitle">客户关系 CR</text><text x="970" y="204" class="body" style="font-size:17px">• 自助发现、订阅与续播</text><text x="970" y="230" class="body" style="font-size:17px">• 时间点评论、楼中楼回复</text><text x="970" y="256" class="body" style="font-size:17px">• 主播互动、投票和置顶</text><text x="970" y="282" class="body" style="font-size:17px">• PLUS 会员服务</text><text x="970" y="308" class="body" style="font-size:17px">• 创作者后台和品牌对接</text><rect x="950" y="420" width="270" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="950" y="420" width="7" height="280" rx="3" fill="#2f6b8a"/><text x="970" y="459" class="celltitle">渠道通路 CH</text><text x="970" y="494" class="body" style="font-size:17px">听众</text><text x="970" y="520" class="body" style="font-size:17px">• 应用商店、站外分享</text><text x="970" y="546" class="body" style="font-size:17px">• 发现页、搜索、节目页</text><text x="970" y="572" class="body" style="font-size:17px">• 订阅页和播放器</text><text x="970" y="598" class="body" style="font-size:17px"></text><text x="970" y="624" class="body" style="font-size:17px">创作者 / 品牌</text><text x="970" y="650" class="body" style="font-size:17px">• 网页或客户端后台</text><text x="970" y="676" class="body" style="font-size:17px">• RSS 认领、原生上传</text><text x="970" y="702" class="body" style="font-size:17px">• 品牌资源、追光商单</text><rect x="1230" y="130" width="330" height="570" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="1230" y="130" width="7" height="570" rx="3" fill="#55758f"/><text x="1250" y="169" class="celltitle">客户细分 CS</text><text x="1250" y="204" class="body" style="font-size:17px">听众</text><text x="1250" y="230" class="body" style="font-size:17px">• 免费收听、订阅和评论</text><text x="1250" y="256" class="body" style="font-size:17px">• PLUS 工具权益用户</text><text x="1250" y="282" class="body" style="font-size:17px">• 付费节目 / 专题用户</text><text x="1250" y="308" class="body" style="font-size:17px"></text><text x="1250" y="334" class="body" style="font-size:17px">内容供给方</text><text x="1250" y="360" class="body" style="font-size:17px">• 主播、节目制作团队</text><text x="1250" y="386" class="body" style="font-size:17px">• 节目运营者</text><text x="1250" y="412" class="body" style="font-size:17px"></text><text x="1250" y="438" class="body" style="font-size:17px">商业客户</text><text x="1250" y="464" class="body" style="font-size:17px">• 品牌方、广告主</text><rect x="40" y="720" width="750" height="190" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="720" width="7" height="190" rx="3" fill="#a66a3f"/><text x="60" y="759" class="celltitle">成本结构 C$</text><text x="60" y="794" class="body" style="font-size:17px">• 创作者结算与内容分成</text><text x="60" y="820" class="body" style="font-size:17px">• 应用商店 / 支付渠道费用</text><text x="60" y="846" class="body" style="font-size:17px">• 托管、存储、带宽和 CDN</text><text x="60" y="872" class="body" style="font-size:17px">• 研发、数据 / 推荐与 AI 运维</text><text x="60" y="898" class="body" style="font-size:17px">• 审核、版权、客服、商务与活动</text><rect x="800" y="720" width="760" height="190" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="800" y="720" width="7" height="190" rx="3" fill="#2f7d73"/><text x="820" y="759" class="celltitle">收入来源 R$</text><text x="820" y="794" class="body" style="font-size:17px">• PLUS 连续会员订阅</text><text x="820" y="820" class="body" style="font-size:17px">• 付费单集、专题或节目</text><text x="820" y="846" class="body" style="font-size:17px">• 听众赞赏</text><text x="820" y="872" class="body" style="font-size:17px">• 品牌播客 / 广告合作及追光商单</text><text x="48" y="940" class="small">注：画布为团队基于公开资料与产品体验的研究归纳；成本类别是成本驱动因素，不代表已披露金额。收入占比、实际分成和利润未知。</text></svg>