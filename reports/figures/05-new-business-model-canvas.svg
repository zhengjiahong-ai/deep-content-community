<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970"><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#243447}.h1{font-size:32px;font-weight:700;fill:#17324d}.sub{font-size:16px;fill:#64748b}.celltitle{font-size:21px;font-weight:700;fill:#17324d}.body{font-size:17px;fill:#334155}.small{font-size:14px;fill:#64748b}</style></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="48" y="55" class="h1">图 5｜本组候选商业模式画布（P0 / P1）</text><text x="50" y="86" class="sub">价值核心先落在个人观点沉淀；主题讨论作为可选增量，收入模型暂不冻结</text><rect x="40" y="130" width="290" height="570" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="130" width="7" height="570" rx="3" fill="#55758f"/><text x="60" y="169" class="celltitle">重要合作 KP</text><text x="60" y="204" class="body" style="font-size:17px">P0</text><text x="60" y="230" class="body" style="font-size:17px">• 内容平台公开链接 / RSS / 元数据</text><text x="60" y="256" class="body" style="font-size:17px">• 云存储、搜索服务与支付服务</text><text x="60" y="282" class="body" style="font-size:17px"></text><text x="60" y="308" class="body" style="font-size:17px">P1（待建立）</text><text x="60" y="334" class="body" style="font-size:17px">• 播客 / 阅读创作者</text><text x="60" y="360" class="body" style="font-size:17px">• 主题组织者或小组发起者</text><text x="60" y="386" class="body" style="font-size:17px">当前没有正式合作关系</text><rect x="340" y="130" width="290" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="340" y="130" width="7" height="280" rx="3" fill="#2f6b8a"/><text x="360" y="169" class="celltitle">关键业务 KA</text><text x="360" y="204" class="body" style="font-size:17px">P0</text><text x="360" y="230" class="body" style="font-size:17px">• 片段捕捉与来源解析</text><text x="360" y="256" class="body" style="font-size:17px">• 个人理解记录、检索与回顾</text><text x="360" y="282" class="body" style="font-size:17px">• 数据导出与链接维护</text><text x="360" y="308" class="body" style="font-size:17px"></text><text x="360" y="334" class="body" style="font-size:17px">P1（验证后）</text><text x="360" y="360" class="body" style="font-size:17px">• 主题组织与讨论维护</text><rect x="340" y="420" width="290" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="340" y="420" width="7" height="280" rx="3" fill="#2f6b8a"/><text x="360" y="459" class="celltitle">核心资源 KR</text><text x="360" y="494" class="body" style="font-size:17px">P0</text><text x="360" y="520" class="body" style="font-size:17px">• 来源元数据与定位锚点</text><text x="360" y="546" class="body" style="font-size:17px">• 个人观点条目与检索索引</text><text x="360" y="572" class="body" style="font-size:17px">• 回到原内容的能力</text><text x="360" y="598" class="body" style="font-size:17px"></text><text x="360" y="624" class="body" style="font-size:17px">P1（验证后）</text><text x="360" y="650" class="body" style="font-size:17px">• 主题内容与参与者关系</text><rect x="640" y="130" width="300" height="570" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="640" y="130" width="7" height="570" rx="3" fill="#2f7d73"/><text x="660" y="169" class="celltitle">价值主张 VP</text><text x="660" y="204" class="body" style="font-size:17px">P0｜当前核心</text><text x="660" y="230" class="body" style="font-size:17px">• 轻量保存片段及出处 / 定位</text><text x="660" y="256" class="body" style="font-size:17px">• 补充自己的理解</text><text x="660" y="282" class="body" style="font-size:17px">• 支持检索、回顾和回到原文</text><text x="660" y="308" class="body" style="font-size:17px"></text><text x="660" y="334" class="body" style="font-size:17px">P1｜可选增量</text><text x="660" y="360" class="body" style="font-size:17px">• 把观点带入主题讨论并获得回应</text><text x="660" y="386" class="body" style="font-size:17px">• 必须证明优于原平台评论 / 熟人聊天</text><text x="660" y="412" class="body" style="font-size:17px"></text><text x="660" y="438" class="body" style="font-size:17px">不预设 AI 摘要或自动知识图谱</text><rect x="950" y="130" width="270" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="950" y="130" width="7" height="280" rx="3" fill="#2f6b8a"/><text x="970" y="169" class="celltitle">客户关系 CR</text><text x="970" y="204" class="body" style="font-size:17px">P0</text><text x="970" y="230" class="body" style="font-size:17px">• 个人账户与观点库</text><text x="970" y="256" class="body" style="font-size:17px">• 检索、回顾、数据导出</text><text x="970" y="282" class="body" style="font-size:17px">• 默认个人使用，不强制公开</text><text x="970" y="308" class="body" style="font-size:17px"></text><text x="970" y="334" class="body" style="font-size:17px">P1（可选）</text><text x="970" y="360" class="body" style="font-size:17px">• 分享、回复或参与主题</text><rect x="950" y="420" width="270" height="280" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="950" y="420" width="7" height="280" rx="3" fill="#2f6b8a"/><text x="970" y="459" class="celltitle">渠道通路 CH</text><text x="970" y="494" class="body" style="font-size:17px">P0</text><text x="970" y="520" class="body" style="font-size:17px">• 外部链接 / 分享导入</text><text x="970" y="546" class="body" style="font-size:17px">• Web / PWA 或移动端入口</text><text x="970" y="572" class="body" style="font-size:17px">• 来源回跳</text><text x="970" y="598" class="body" style="font-size:17px"></text><text x="970" y="624" class="body" style="font-size:17px">P1（待验证）</text><text x="970" y="650" class="body" style="font-size:17px">• 主题页、分享链接</text><text x="970" y="676" class="body" style="font-size:17px">• 邀请入口</text><rect x="1230" y="130" width="330" height="570" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="1230" y="130" width="7" height="570" rx="3" fill="#55758f"/><text x="1250" y="169" class="celltitle">客户细分 CS</text><text x="1250" y="204" class="body" style="font-size:17px">P0 核心用户</text><text x="1250" y="230" class="body" style="font-size:17px">• 经常消费播客、书籍、长文章</text><text x="1250" y="256" class="body" style="font-size:17px">• 希望保存观点和出处的人</text><text x="1250" y="282" class="body" style="font-size:17px"></text><text x="1250" y="308" class="body" style="font-size:17px">P1 候选用户</text><text x="1250" y="334" class="body" style="font-size:17px">• 有明确交流意愿的人</text><text x="1250" y="360" class="body" style="font-size:17px">• 主题组织者是否为客户待验证</text><text x="1250" y="386" class="body" style="font-size:17px"></text><text x="1250" y="412" class="body" style="font-size:17px">不假设所有用户都参与讨论</text><rect x="40" y="720" width="750" height="190" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="720" width="7" height="190" rx="3" fill="#a66a3f"/><text x="60" y="759" class="celltitle">成本结构 C$</text><text x="60" y="794" class="body" style="font-size:17px">• 产品研发、云存储与检索</text><text x="60" y="820" class="body" style="font-size:17px">• 来源解析、锚点维护和用户支持</text><text x="60" y="846" class="body" style="font-size:17px">• 隐私、版权与数据合规</text><text x="60" y="872" class="body" style="font-size:17px">P1 若验证后才增加：讨论治理、冷启动与主题运营</text><rect x="800" y="720" width="760" height="190" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="800" y="720" width="7" height="190" rx="3" fill="#2f7d73"/><text x="820" y="759" class="celltitle">收入来源 R$</text><text x="820" y="794" class="body" style="font-size:17px">暂不冻结：先验证持续使用和价值</text><text x="820" y="820" class="body" style="font-size:17px">• 可测试高级个人检索 / 个人档案等权益</text><text x="820" y="846" class="body" style="font-size:17px">• P1 私密主题空间 / 组织者工具仅为后续假设</text><text x="820" y="872" class="body" style="font-size:17px">• 不直接套用竞品会员价格</text><text x="48" y="940" class="small">注：本画布是研究阶段的候选商业模式，不是最终 MVP 冻结。P0 先独立成立；P1 只有经验证后才纳入；P2 完整社区生态暂缓。</text></svg>