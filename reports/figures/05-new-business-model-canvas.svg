<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#26384a}.h1{font-size:32px;font-weight:700;fill:#17324d}.sub{font-size:16px;fill:#64748b}.ct{font-size:20px;font-weight:700;fill:#17324d}.bd{font-size:16px;fill:#334155}.sm{font-size:14px;fill:#64748b}</style></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="42" y="52" class="h1">图 5｜本组新商业模式画布</text><text x="44" y="82" class="sub">个人观点库与内容锚定讨论空间共同构成社区产品</text><rect x="30" y="115" width="285" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="30" y="115" width="7" height="275" rx="3" fill="#55758f"/><text x="48" y="149" class="ct">重要合作 KP</text><text x="48" y="180" class="bd" style="font-size:16px">• 内容平台公开链接/RSS/元数据</text><text x="48" y="205" class="bd" style="font-size:16px">• 云存储、搜索和支付服务商</text><text x="48" y="230" class="bd" style="font-size:16px">• 创作者、主题组织者和版主</text><rect x="325" y="115" width="285" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="325" y="115" width="7" height="275" rx="3" fill="#2f6b8a"/><text x="343" y="149" class="ct">关键业务 KA</text><text x="343" y="180" class="bd" style="font-size:16px">• 片段捕捉和来源定位</text><text x="343" y="205" class="bd" style="font-size:16px">• 个人批注、检索与回顾</text><text x="343" y="230" class="bd" style="font-size:16px">• 内容讨论运营和治理</text><text x="343" y="255" class="bd" style="font-size:16px">• 讨论结果归档与导出</text><rect x="325" y="400" width="285" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="325" y="400" width="7" height="275" rx="3" fill="#2f6b8a"/><text x="343" y="434" class="ct">核心资源 KR</text><text x="343" y="465" class="bd" style="font-size:16px">• 来源解析与锚点系统</text><text x="343" y="490" class="bd" style="font-size:16px">• 个人观点库和检索索引</text><text x="343" y="515" class="bd" style="font-size:16px">• 内容—讨论索引</text><text x="343" y="540" class="bd" style="font-size:16px">• 社区治理机制</text><rect x="620" y="115" width="340" height="560" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="620" y="115" width="7" height="560" rx="3" fill="#2f7d73"/><text x="638" y="149" class="ct">价值主张 VP</text><text x="638" y="180" class="bd" style="font-size:16px">个人观点库</text><text x="638" y="205" class="bd" style="font-size:16px">• 保存片段、出处和个人理解</text><text x="638" y="230" class="bd" style="font-size:16px">• 检索、回顾、返回原内容</text><text x="638" y="255" class="bd" style="font-size:16px"></text><text x="638" y="280" class="bd" style="font-size:16px">内容锚定讨论空间</text><text x="638" y="305" class="bd" style="font-size:16px">• 围绕播客、文章和书籍交流</text><text x="638" y="330" class="bd" style="font-size:16px">• 关联时间点、页码或段落</text><text x="638" y="355" class="bd" style="font-size:16px">• 讨论结果可保存回个人库</text><text x="638" y="380" class="bd" style="font-size:16px"></text><text x="638" y="405" class="bd" style="font-size:16px">用户可只保存，也可参与讨论</text><rect x="970" y="115" width="265" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="970" y="115" width="7" height="275" rx="3" fill="#2f6b8a"/><text x="988" y="149" class="ct">客户关系 CR</text><text x="988" y="180" class="bd" style="font-size:16px">• 个人账户与个人观点库</text><text x="988" y="205" class="bd" style="font-size:16px">• 浏览、发帖、回复</text><text x="988" y="230" class="bd" style="font-size:16px">• 公开/私密/个人保存选择</text><text x="988" y="255" class="bd" style="font-size:16px">• 举报、删除和申诉机制</text><rect x="970" y="400" width="265" height="275" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="970" y="400" width="7" height="275" rx="3" fill="#2f6b8a"/><text x="988" y="434" class="ct">渠道通路 CH</text><text x="988" y="465" class="bd" style="font-size:16px">• Web/移动端</text><text x="988" y="490" class="bd" style="font-size:16px">• 浏览器扩展/系统分享</text><text x="988" y="515" class="bd" style="font-size:16px">• 内容链接导入</text><text x="988" y="540" class="bd" style="font-size:16px">• 主题页和讨论分享链接</text><rect x="1245" y="115" width="325" height="560" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="1245" y="115" width="7" height="560" rx="3" fill="#55758f"/><text x="1263" y="149" class="ct">客户细分 CS</text><text x="1263" y="180" class="bd" style="font-size:16px">个人用户</text><text x="1263" y="205" class="bd" style="font-size:16px">• 深度内容消费者</text><text x="1263" y="230" class="bd" style="font-size:16px">• 希望保存观点和出处的人</text><text x="1263" y="255" class="bd" style="font-size:16px"></text><text x="1263" y="280" class="bd" style="font-size:16px">社区参与者</text><text x="1263" y="305" class="bd" style="font-size:16px">• 希望围绕内容交流的读者</text><text x="1263" y="330" class="bd" style="font-size:16px">• 讨论发起者和版主</text><rect x="30" y="690" width="760" height="190" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="30" y="690" width="7" height="190" rx="3" fill="#a66a3f"/><text x="48" y="724" class="ct">成本结构 C$</text><text x="48" y="755" class="bd" style="font-size:16px">• 产品研发、来源解析和锚点维护</text><text x="48" y="780" class="bd" style="font-size:16px">• 云存储、搜索与同步</text><text x="48" y="805" class="bd" style="font-size:16px">• 社区审核、治理和用户支持</text><text x="48" y="830" class="bd" style="font-size:16px">• 隐私、版权合规和获客运营</text><rect x="800" y="690" width="770" height="190" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="800" y="690" width="7" height="190" rx="3" fill="#2f7d73"/><text x="818" y="724" class="ct">收入来源 R$</text><text x="818" y="755" class="bd" style="font-size:16px">免费：基础捕捉、个人记录和公开讨论</text><text x="818" y="780" class="bd" style="font-size:16px">会员：高级检索、跨设备同步、批量导出</text><text x="818" y="805" class="bd" style="font-size:16px">会员：更大个人归档空间</text><text x="818" y="830" class="bd" style="font-size:16px">价格和付费率属于待经营验证数据，不作预测</text><text x="36" y="910" class="sm">注：这是本组设计方案；合作方为潜在生态/服务依赖类别，非已签约伙伴；会员权益尚无运营数据证明其付费转化。</text></svg>