<g fill="#2f7d73"><circle cx="200" cy="410" r="6"/><circle cx="410" cy="205" r="6"/><circle cx="620" cy="205" r="6"/><circle cx="830" cy="205" r="6"/><circle cx="1040" cy="205" r="6"/><circle cx="1250" cy="615" r="6"/><circle cx="1460" cy="615" r="6"/></g>
