<g class="factor" text-anchor="middle">
<text x="200" y="665"><tspan x="200">内容发现</tspan><tspan x="200" dy="24">与消费</tspan></text>
<text x="410" y="665"><tspan x="410">快速片段</tspan><tspan x="410" dy="24">捕捉</tspan></text>
<text x="620" y="665"><tspan x="620">来源锚点</tspan><tspan x="620" dy="24">保留</tspan></text>
<text x="830" y="665"><tspan x="830">个人理解</tspan><tspan x="830" dy="24">沉淀</tspan></text>
<text x="1040" y="665"><tspan x="1040">跨来源检索</tspan><tspan x="1040" dy="24">与回顾</tspan></text>
<text x="1250" y="665"><tspan x="1250">内容锚定</tspan><tspan x="1250" dy="24">讨论</tspan></text>
<text x="1460" y="665"><tspan x="1460">讨论回流</tspan><tspan x="1460" dy="24">个人库</tspan></text>
</g>
<text x="48" y="755" class="note">说明：曲线依据竞品矩阵和成员实测作定性归类；“非核心/未观察”不等于产品绝对不具备该能力。</text>
<text x="48" y="781" class="note">类别曲线概括本次选取产品的典型能力重心，不是类别均值，也不表示用户满意度、性能、使用频率或市场表现。</text>
<g>
<line x1="65" y1="835" x2="125" y2="835" stroke="#2f6b8a" stroke-width="4"/><text x="140" y="841" class="legend">内容平台（小宇宙、微信读书）</text>
<line x1="565" y1="835" x2="625" y2="835" stroke="#2f7d73" stroke-width="4"/><text x="640" y="841" class="legend">内容捕捉工具（Snipd、Reader、Cubox）</text>
<line x1="1120" y1="835" x2="1180" y2="835" stroke="#b77936" stroke-width="4"/><text x="1195" y="841" class="legend">个人知识管理</text>
<line x1="65" y1="890" x2="125" y2="890" stroke="#8064a2" stroke-width="4"/><text x="140" y="896" class="legend">内容社区（豆瓣、即刻）</text>
<line x1="565" y1="890" x2="625" y2="890" stroke="#c65d35" stroke-width="5" stroke-dasharray="12 9"/><text x="640" y="896" class="legend">本组方案（设计目标，非已验证能力）</text>
</g>
<text x="48" y="958" class="note">资料基础：团队竞品统一矩阵、M2 内容平台旅程、M3 内容捕捉矩阵、M4 个人知识与社区产品实测。</text>
</svg>