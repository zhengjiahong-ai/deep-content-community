<rect width="1600" height="1000" fill="#f4f7fa"/>
<text x="48" y="56" class="h1">竞争要素的定性价值曲线</text>
<text x="50" y="88" class="sub">对照不同产品类别在深度内容任务链中的能力覆盖重心</text>
<text x="54" y="155" class="axis">能力覆盖</text>
<line x1="180" y1="205" x2="1460" y2="205" stroke="#cbd5e1" stroke-width="2"/>
