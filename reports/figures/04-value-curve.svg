<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><style>
text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#26384a}
.h1{font-size:32px;font-weight:700;fill:#17324d}
.sub{font-size:17px;fill:#64748b}
.axis{font-size:16px;fill:#64748b}
