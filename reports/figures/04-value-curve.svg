<text x="140" y="416" class="axis" text-anchor="end">部分支持</text>
<text x="140" y="621" class="axis" text-anchor="end">非核心 / 未观察</text>
<g stroke="#e2e8f0" stroke-width="1">
<line x1="200" y1="205" x2="200" y2="615"/><line x1="410" y1="205" x2="410" y2="615"/><line x1="620" y1="205" x2="620" y2="615"/><line x1="830" y1="205" x2="830" y2="615"/><line x1="1040" y1="205" x2="1040" y2="615"/><line x1="1250" y1="205" x2="1250" y2="615"/><line x1="1460" y1="205" x2="1460" y2="615"/>
</g>
<g fill="none" stroke-linejoin="round" stroke-linecap="round">
<polyline points="200,205 410,205 620,205 830,205 1040,615 1250,205 1460,410" stroke="#2f6b8a" stroke-width="4"/>
<polyline points="200,410 410,205 620,205 830,205 1040,205 1250,615 1460,615" stroke="#2f7d73" stroke-width="4"/>
