<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#26384a}.h1{font-size:32px;font-weight:700;fill:#17324d}.sub{font-size:16px;fill:#64748b}.ct{font-size:20px;font-weight:700;fill:#17324d}.bd{font-size:16px;fill:#334155}.sm{font-size:14px;fill:#64748b}</style></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="42" y="52" class="h1">图 3｜总体评估与价值主张 SWOT</text><text x="44" y="82" class="sub">S/W 属于内部特征并置于价值主张格内；O/T 为外部因素并指向价值主张</text><rect x="35" y="155" width="330" height="340" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="35" y="155" width="7" height="340" rx="3" fill="#2f7d73"/><text x="53" y="189" class="ct">外部机会 O</text><text x="53" y="220" class="bd" style="font-size:16px">O1｜54.6%受访听众会看评论</text><text x="53" y="245" class="bd" style="font-size:16px">19.4%会写评论（2024调查）</text><text x="53" y="270" class="bd" style="font-size:16px">O2｜真实访谈出现分享和讨论</text><text x="53" y="295" class="bd" style="font-size:16px">行为，但不证明新社区迁移</text><rect x="415" y="130" width="770" height="400" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="415" y="130" width="7" height="400" rx="3" fill="#2f6b8a"/><text x="433" y="164" class="ct">焦点画布项｜价值主张 VP</text><text x="433" y="195" class="bd" style="font-size:17px">S｜内部优势</text><text x="433" y="220" class="bd" style="font-size:17px">• 时间点评论可回到对应原声</text><text x="433" y="245" class="bd" style="font-size:17px">• 主播可回复、置顶并组织互动</text><text x="433" y="270" class="bd" style="font-size:17px">• 发现、订阅和播放链路较完整</text><text x="433" y="295" class="bd" style="font-size:17px"></text><text x="433" y="320" class="bd" style="font-size:17px">W｜内部边界</text><text x="433" y="345" class="bd" style="font-size:17px">• 讨论主要围绕平台内播客内容</text><text x="433" y="370" class="bd" style="font-size:17px">• 私人时点笔记列为 PLUS 权益</text><text x="433" y="395" class="bd" style="font-size:17px">• 站外分享回到原讨论路径未完整核实</text><rect x="1235" y="155" width="330" height="340" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="1235" y="155" width="7" height="340" rx="3" fill="#a64b4b"/><text x="1253" y="189" class="ct">外部威胁 T</text><text x="1253" y="220" class="bd" style="font-size:16px">T1｜订阅节目多不等于收听时间</text><text x="1253" y="245" class="bd" style="font-size:16px">充足，注意力竞争激烈</text><text x="1253" y="270" class="bd" style="font-size:16px">T2｜内容平台、笔记工具、社区</text><text x="1253" y="295" class="bd" style="font-size:16px">和熟人聊天均可替代部分任务</text><path d="M365 325 L410 325 M1235 325 L1190 325" stroke="#64748b" stroke-width="3" fill="none"/><rect x="35" y="570" width="485" height="300" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="35" y="570" width="7" height="300" rx="3" fill="#55758f"/><text x="53" y="604" class="ct">用户界面｜CS / CH / CR</text><text x="53" y="635" class="bd" style="font-size:16px">+ 搜索、订阅、续播和评论回听</text><text x="53" y="660" class="bd" style="font-size:16px"> + 主播可回复、投票、置顶</text><text x="53" y="685" class="bd" style="font-size:16px">− 首访发现和站外回流存在摩擦</text><text x="53" y="710" class="bd" style="font-size:16px">（限于单次受测路径）</text><rect x="555" y="570" width="485" height="300" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="555" y="570" width="7" height="300" rx="3" fill="#55758f"/><text x="573" y="604" class="ct">基础设施｜KR / KA / KP</text><text x="573" y="635" class="bd" style="font-size:16px">+ RSS 与原生托管多路径供给</text><text x="573" y="660" class="bd" style="font-size:16px">+ 创作者后台和数据看板</text><text x="573" y="685" class="bd" style="font-size:16px">− 创作者可多平台分发</text><text x="573" y="710" class="bd" style="font-size:16px">− 审核、版权治理成本金额未公开</text><rect x="1075" y="570" width="490" height="300" rx="11" fill="#fff" stroke="#cbd5e1"/><rect x="1075" y="570" width="7" height="300" rx="3" fill="#a66a3f"/><text x="1093" y="604" class="ct">收入与支出｜R$ / C$</text><text x="1093" y="635" class="bd" style="font-size:16px">+ PLUS、付费内容、赞赏、品牌合作</text><text x="1093" y="660" class="bd" style="font-size:16px">− 会员标价不能代表净收入</text><text x="1093" y="685" class="bd" style="font-size:16px">− 分成、渠道费率、实际成本未公开</text><text x="1093" y="710" class="bd" style="font-size:16px">结论：有商业化机制，盈利能力未知</text><text x="40" y="920" class="sm">O/T 为外部环境，不把产品内部边界误写为外部威胁。</text></svg>