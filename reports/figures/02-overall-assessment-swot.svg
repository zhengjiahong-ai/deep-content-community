<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970"><defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#243447}.h1{font-size:32px;font-weight:700;fill:#17324d}.sub{font-size:16px;fill:#64748b}.celltitle{font-size:21px;font-weight:700;fill:#17324d}.body{font-size:17px;fill:#334155}.small{font-size:14px;fill:#64748b}</style></defs><rect width="100%" height="100%" fill="#f4f7fa"/><text x="48" y="55" class="h1">图 2｜总体评估与价值主张 SWOT</text><text x="50" y="86" class="sub">S / W 放入所选画布项；O / T 置于画布项外并指向价值主张</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect x="45" y="165" width="315" height="370" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="45" y="165" width="7" height="370" rx="3" fill="#2f7d73"/><text x="65" y="204" class="celltitle">外部机会 O</text><text x="65" y="239" class="body" style="font-size:16px">O1｜行业调查中 54.6% 会看评论</text><text x="65" y="265" class="body" style="font-size:16px">19.4% 会写评论（样本可重叠）</text><text x="65" y="291" class="body" style="font-size:16px">O2｜真实访谈出现分享、讨论</text><text x="65" y="317" class="body" style="font-size:16px">和希望获得回应的行为线索</text><text x="65" y="343" class="body" style="font-size:16px">但不证明愿意迁移到新社区</text>
<rect x="420" y="145" width="760" height="410" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="420" y="145" width="7" height="410" rx="3" fill="#2f6b8a"/><text x="440" y="184" class="celltitle">焦点画布项｜价值主张 VP</text><text x="440" y="219" class="body" style="font-size:17px">S｜内部优势</text><text x="440" y="245" class="body" style="font-size:17px">• 评论时间戳可回到对应原声</text><text x="440" y="271" class="body" style="font-size:17px">• 主播可回复、置顶并组织互动</text><text x="440" y="297" class="body" style="font-size:17px">• 搜索、订阅、播放链路较完整</text><text x="440" y="323" class="body" style="font-size:17px"></text><text x="440" y="349" class="body" style="font-size:17px">W｜内部弱点 / 边界</text><text x="440" y="375" class="body" style="font-size:17px">• 讨论主要围绕平台内播客单集</text><text x="440" y="401" class="body" style="font-size:17px">• 私人时点笔记列入 PLUS 权益</text><text x="440" y="427" class="body" style="font-size:17px">• 站外分享回到原讨论的路径待核</text>
<rect x="1250" y="165" width="305" height="370" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="1250" y="165" width="7" height="370" rx="3" fill="#a64b4b"/><text x="1270" y="204" class="celltitle">外部威胁 T</text><text x="1270" y="239" class="body" style="font-size:16px">T1｜用户注意力有限：订阅多</text><text x="1270" y="265" class="body" style="font-size:16px">不等于实际收听时间充足</text><text x="1270" y="291" class="body" style="font-size:16px">T2｜内容平台、笔记工具、</text><text x="1270" y="317" class="body" style="font-size:16px">兴趣社区和熟人聊天均可替代</text><text x="1270" y="343" class="body" style="font-size:16px">用户可能多平台并用而非迁移</text>
<path d="M360 355 C385 355 395 355 418 355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1250 355 C1225 355 1205 355 1182 355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="45" y="585" width="475" height="320" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="45" y="585" width="7" height="320" rx="3" fill="#55758f"/><text x="65" y="624" class="celltitle">用户界面｜CS / CH / CR</text><text x="65" y="659" class="body" style="font-size:16px">+ 搜索、订阅、续播与评论回听路径走通</text><text x="65" y="685" class="body" style="font-size:16px">+ 主播可用投票、回复、置顶组织互动</text><text x="65" y="711" class="body" style="font-size:16px">− 首访发现未直接匹配兴趣（单次体验）</text><text x="65" y="737" class="body" style="font-size:16px">− 非会员私密记录入口及站外回流待核</text>
<rect x="560" y="585" width="475" height="320" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="560" y="585" width="7" height="320" rx="3" fill="#55758f"/><text x="580" y="624" class="celltitle">基础设施｜KR / KA / KP</text><text x="580" y="659" class="body" style="font-size:16px">+ RSS 与原生托管提供多路径供给</text><text x="580" y="685" class="body" style="font-size:16px">+ 社区互动、创作者后台与数据看板</text><text x="580" y="711" class="body" style="font-size:16px">− 创作者可多平台分发，独家性有限</text><text x="580" y="737" class="body" style="font-size:16px">− 审核、版权和治理成本金额未知</text>
<rect x="1075" y="585" width="480" height="320" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="1075" y="585" width="7" height="320" rx="3" fill="#a66a3f"/><text x="1095" y="624" class="celltitle">收入与支出｜R$ / C$</text><text x="1095" y="659" class="body" style="font-size:16px">+ PLUS、付费内容、赞赏、品牌合作入口</text><text x="1095" y="685" class="body" style="font-size:16px">− 会员标价不能替代实际收入</text><text x="1095" y="711" class="body" style="font-size:16px">− 分成、渠道费率、成本和利润未披露</text><text x="1095" y="737" class="body" style="font-size:16px">结论：商业化机制存在，盈利能力未知</text>
<text x="48" y="944" class="small">注：S/W 属于小宇宙内部价值主张特征；O/T 是外部因素，箭头指向被评估的价值主张。其余三部分仅作加分项 / 减分项总体评估。</text></svg>