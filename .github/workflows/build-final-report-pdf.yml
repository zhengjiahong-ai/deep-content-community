name: Build final course report PDF

on:
  push:
    branches:
      - docs/m1-final-report-draft-2026-11-14
    paths:
      - 'reports/FINAL_REPORT_DRAFT.md'
      - 'reports/figures/**'
      - '.github/workflows/build-final-report-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout report source
        uses: actions/checkout@v4
        with:
          ref: docs/m1-final-report-draft-2026-11-14

      - name: Install PDF toolchain and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-lang-chinese fonts-noto-cjk librsvg2-bin poppler-utils

      - name: Verify Chinese typesetting dependencies
        run: |
          kpsewhich xeCJK.sty
          fc-match 'Noto Sans CJK SC'
          rsvg-convert --version

      - name: Build PDF
        run: |
          mkdir -p dist
          pandoc reports/FINAL_REPORT_DRAFT.md \
            --from=gfm+raw_tex+link_attributes \
            --metadata=lang:zh-CN \
            --pdf-engine=xelatex \
            --resource-path=.:reports \
            --variable=mainfont:"Noto Sans CJK SC" \
            --variable=CJKmainfont:"Noto Sans CJK SC" \
            --variable=papersize:a4\n            --variable=geometry:a4paper,margin=22mm \
            --variable=fontsize:11pt \
            --variable=linestretch:1.35 \
            --variable=colorlinks:true \
            --toc \
            --toc-depth=2 \
            --highlight-style=tango \
            --output=dist/深度内容思考与共鸣社区_竞品选择与商业模式评估报告.pdf
          PDF='dist/深度内容思考与共鸣社区_竞品选择与商业模式评估报告.pdf'
          test -s "$PDF"
          pdfinfo "$PDF"
          pdftotext -layout "$PDF" dist/report-extracted.txt
          test -s dist/report-extracted.txt
          mkdir -p dist/preview
          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          echo "PDF pages: $PAGES"
          pdftoppm -f 1 -l 3 -png -r 110 "$PDF" dist/preview/page >/dev/null 2>&1
          ls -lh "$PDF" dist/preview/

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-course-report-pdf
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 14
